name: release

on:
  push:
    tags: ['v*']

# Deliberately *not* `id-token: write` here. At workflow level it applies to every job, and GitHub
# exports ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN to every step of a job
# that holds it. The `publish` job below asks for it; nothing else gets it (issue #22).
permissions:
  contents: read

jobs:
  # Everything that runs code this repository did not write. It holds no OIDC permission, so a
  # compromised dependency here has nothing to mint a publishing credential from.
  #
  # #21 stopped dependency *lifecycle scripts* from running during installs. It could not stop the
  # dependency code these steps invoke on purpose: `npm run typecheck` executes `tsc` out of
  # node_modules, and the suite loads whatever the tree resolves. Splitting the jobs is what covers
  # that, because the separation is a permission boundary rather than a flag.
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not to tags, in both jobs. This job cannot publish, but it produces
      # the artifact the one that can will publish, so a retagged action is still a path into a
      # released version. The trailing comment is the human-readable version and what Dependabot
      # bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so there is nothing for a stored credential to be for, and
          # this is the job that runs third-party code.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not the engines floor of 22, because trusted publishing needs npm >= 11.5.1 and
          # Node 22 still ships npm 10. The floor is exercised by the ci workflow on every PR.
          node-version: '24'
          # Caching is off, and `package-manager-cache: false` keeps it off if a `packageManager` or
          # `devEngines.packageManager` field is ever added — that field would otherwise turn
          # caching back on automatically. The Actions cache is a cross-job channel, and this job
          # hands an artifact to a privileged one, so a poisoned cache would reach the published
          # tarball. `npm ci` does verify integrity hashes against the lockfile, so this is defence
          # in depth rather than a live hole, but a release build is where a clean environment is
          # worth more than the seconds a cache saves. setup-node's own advanced-usage docs
          # recommend disabling it for privileged workflows.
          package-manager-cache: false

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/indexwright/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/indexwright/package.json version $version" >&2
            exit 1
          fi

      # The whole workspace, not just this package: they build from one tsconfig chain and the
      # tarball checks cover both, so a release that breaks the other one should not ship.
      #
      # --ignore-scripts stays. It is no longer the thing standing between a dependency and the
      # publishing credential — this job has none — but a release build is not where an install
      # script should be running, and both workflows carry the same flags on purpose. An asymmetry
      # between them would read as a deliberate distinction and there is none.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify-package

      # Packed here rather than in the publish job, which is the point of the split: `npm publish`
      # from a directory runs `prepublishOnly`, and this package's is `npm run build` — `tsc` out of
      # node_modules, in the job holding the credential. Handing over a tarball means the publish
      # job has nothing to build and so never installs.
      #
      # What that job's safety rests on is the absence of node_modules, not on which lifecycle
      # scripts a tarball publish skips: npm's docs list the scripts `npm publish` runs without
      # saying whether a pre-packed tarball skips them, and that was left unverified rather than
      # assumed. It does not need settling. With nothing installed, a `prepublishOnly` that did fire
      # would fail to find `tsc` and take the job down — loudly, and without running a line of
      # anything this tree depends on.
      #
      # `verify-package` has just built and packed both packages and installed them into throwaway
      # consumers, so what is packed here is a tree that was checked, not merely one that compiled.
      #
      # Packed into a directory of its own rather than the repository root, so that what is uploaded
      # can only be what this step produced. `indexwright-record-0.4.0.tgz` matches an
      # `indexwright-*.tgz` glob, and the one thing these two workflows must never do is publish
      # each other's package — the tag filters are written so they cannot, and a glob at the root
      # would put it back.
      #
      # `mkdir -p` first: `--pack-destination` does not create the directory, it fails ENOENT — and
      # a release workflow is the worst place to find that out.
      - run: mkdir -p release-tarball && npm pack -w indexwright --pack-destination release-tarball
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linter-tarball
          path: release-tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Scoped to this job, which runs no third-party code: it installs nothing, so there is no
      # node_modules for anything to execute out of. npm itself is the runner's, not this tree's.
      id-token: write
    steps:
      # Checked out for the committed .npmrc, which pins the registry. Nothing else here reads the
      # tree, and nothing installs from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # registry-url is deliberately absent. It makes setup-node write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into an .npmrc, and with no token
          # set that is an empty auth line — npm reads it as "auth is already configured", never
          # starts the OIDC exchange, and fails with ENEEDAUTH. The registry is pinned by the
          # .npmrc committed at the repository root, so nothing here needs to set it.
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linter-tarball
          path: release-tarball

      # No NODE_AUTH_TOKEN: npm exchanges this job's OIDC identity for a short-lived credential.
      # The trusted-publisher trust is bound to the workflow *file*, so splitting one job into two
      # inside the same file does not disturb it.
      #
      # The count is checked rather than trusted to a glob. This step publishes whatever it is
      # handed, under an identity that can publish this package, and a version cannot be replaced
      # once it is out — so "exactly one tarball, or stop" is worth two lines.
      #
      # `--provenance` is kept although trusted publishing generates an attestation without it. The
      # flag is what makes a failure to generate one loud: this is the first release to publish a
      # tarball packed in another job, and the attestation's subject is the digest of the tarball
      # being published, so it should hold — but a silent publish without provenance is the outcome
      # worth refusing, and asking explicitly is what turns it into a failed job.
      - name: Publish the tarball the verify job packed
        run: |
          shopt -s nullglob
          tarballs=(./release-tarball/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one tarball, found ${#tarballs[@]}: ${tarballs[*]}" >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance --access public
