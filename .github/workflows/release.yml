name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for npm provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not to tags: this job can mint an npm publishing credential from
      # its OIDC identity, so a retagged action would be a supply-chain path into a released
      # version. The trailing comment is the human-readable version and what Dependabot bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes to git, so there is nothing for a stored credential to be for.
          # The steps below no longer run dependency lifecycle scripts — see the `npm ci` step —
          # but they do run this tree's own code, and a GITHUB_TOKEN left in .git/config would be
          # a credential sitting in reach of it for no reason.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24, not the engines floor of 22, because trusted publishing needs npm >= 11.5.1 and
          # Node 22 still ships npm 10. The floor is exercised by the ci workflow on every PR.
          node-version: '24'
          # registry-url is deliberately absent. It makes setup-node write
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into an .npmrc, and with no token
          # set that is an empty auth line — npm reads it as "auth is already configured", never
          # starts the OIDC exchange, and fails with ENEEDAUTH. The registry is pinned by the
          # .npmrc committed at the repository root, so nothing here needs to set it.
          #
          # Caching is deliberately off, and `package-manager-cache: false` keeps it off if a
          # `packageManager` or `devEngines.packageManager` field is ever added — that field would
          # otherwise turn caching back on automatically. The Actions cache is a cross-job channel
          # into a job holding a publishing credential. `npm ci` does verify integrity hashes
          # against the lockfile, so this is defence in depth rather than a live hole, but a release
          # build is where a clean environment is worth more than the seconds a cache saves.
          # setup-node's own advanced-usage docs recommend disabling it for privileged workflows.
          package-manager-cache: false

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./packages/indexwright/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/indexwright/package.json version $version" >&2
            exit 1
          fi

      # --ignore-scripts, because this job holds `id-token: write` and GitHub exports
      # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN to *every* step of such a
      # job, not only to the step that needs them. A dependency shipping a lifecycle script would
      # therefore run with the ability to request an OIDC token for audience npm:registry.npmjs.org,
      # exchange it for this package's trusted-publisher credential, and publish an arbitrary
      # tarball with valid provenance attached — before the publish step below ever runs. Neither
      # `persist-credentials: false` nor the SHA-pinned actions cover that: the token is minted on
      # demand from the job environment, not read from the checkout.
      #
      # Nothing here needs install-time scripts. The build is an explicit step already, because both
      # `npm test` and `npm run verify-package` call `npm run build` themselves — a deliberate
      # choice, so that `ignore-scripts=true` in a developer's own config cannot silently test a
      # stale dist/. The flag stays on this invocation rather than moving into a config file for the
      # same reason inverted: set globally it would also suppress `prepublishOnly`, which is how the
      # tarball gets a dist/ at all.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify-package

      # Published from the workspace root so the committed .npmrc applies, and named with `-w` so
      # the root — which is private and publishes nothing — cannot be the thing that goes out.
      #
      # No NODE_AUTH_TOKEN: npm exchanges the job's OIDC identity for a short-lived credential,
      # which npmjs.com grants only to the trusted publisher configured for this package —
      # uny/indexwright, workflow release.yml. There is no long-lived secret to leak or rotate.
      - run: npm publish -w indexwright --provenance --access public
