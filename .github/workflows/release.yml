name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for npm provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not to tags: this job holds the publish token and can mint
      # provenance, so a retagged action would be a supply-chain path into a released version.
      # The trailing comment is the human-readable version and what Dependabot bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify-package

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
